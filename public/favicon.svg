<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Dark glassmorphic background with subtle crimson vignette -->
    <linearGradient id="nether-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <!-- Vertical left stem gradient -->
    <linearGradient id="stem-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#990b13"/>
      <stop offset="100%" stop-color="#c40812"/>
    </linearGradient>
    <!-- Vertical right stem gradient -->
    <linearGradient id="stem-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8000b"/>
      <stop offset="100%" stop-color="#80060c"/>
    </linearGradient>
    <!-- Glowing diagonal blade ribbon -->
    <linearGradient id="blade-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d5a"/>
      <stop offset="35%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#a80710"/>
    </linearGradient>
    <filter id="nether-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e50914" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Card Base -->
  <rect width="64" height="64" rx="16" fill="url(#nether-card)" stroke="#e5091440" stroke-width="1.2"/>
  
  <!-- NetherFlix 'N' Ribbon Monogram -->
  <g filter="url(#nether-glow)">
    <!-- Left Vertical Pillar -->
    <path d="M15 11h9v42h-9z" fill="url(#stem-left)"/>
    <!-- Right Vertical Pillar -->
    <path d="M40 11h9v42h-9z" fill="url(#stem-right)"/>
    <!-- Diagonal Folded Ribbon -->
    <path d="M15 11h10l24 42h-10L15 11z" fill="url(#blade-diag)"/>
  </g>
</svg>

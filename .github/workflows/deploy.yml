name: Build & Deploy NetherFlix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netherflix-web-dist
          path: dist/

      - name: Upload Android APK Artifact
        if: hashFiles('public/netherflix.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: netherflix-android-apk
          path: public/netherflix.apk
